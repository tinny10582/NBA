# ===============================
# 📊 抓NBA賠率
# ===============================
def get_odds():
    url = f"https://api.the-odds-api.com/v4/sports/basketball_nba/odds/?apiKey={ODDS_API_KEY}&regions=us&markets=h2h"
    res = requests.get(url)

    if res.status_code != 200:
        return pd.DataFrame()

    data = res.json()
    games = []

    for game in data:
        home = game["home_team"]
        away = game["away_team"]

        for bookmaker in game["bookmakers"]:
            for market in bookmaker["markets"]:
                for outcome in market["outcomes"]:
                    games.append({
                        "match": f"{away} vs {home}",
                        "team": outcome["name"],
                        "odds": outcome["price"]
                    })

    return pd.DataFrame(games)

# ===============================
# 🧠 簡化模型（可升級）
# ===============================
def model_predict():
    scoreA = random.randint(100,120)
    scoreB = random.randint(95,115)
    total = scoreA + scoreB
    diff = scoreA - scoreB
    prob = random.uniform(0.55,0.62)

    return scoreA, scoreB, total, diff, prob

# ===============================
# ⭐ 星級
# ===============================
def get_star(prob, ev):
    if prob >= 0.60 and ev >= 0.08:
        return 3
    elif prob >= 0.57 and ev >= 0.05:
        return 2
    elif prob >= 0.54 and ev >= 0.02:
        return 1
    else:
        return 0

# ===============================
# 🎯 分析
# ===============================
def analyze(df):
    results = []

    matches = df["match"].unique()

    for match in matches:
        sub = df[df["match"] == match]
        odds = sub.iloc[0]["odds"]

        scoreA, scoreB, total, diff, prob = model_predict()
        ev = prob * odds - 1

        # 三盤判斷
        if diff > 0:
            ml = sub.iloc[0]["team"]
        else:
            ml = sub.iloc[-1]["team"]

        spread = "讓分方" if diff > 5 else "受讓方"
        total_pick = "大分" if total > 215 else "小分"

        # 👉 優先大小分
        pick = total_pick

        star = get_star(prob, ev)

        if star > 0:
            results.append({
                "match": match,
                "pick": pick,
                "prob": prob,
                "star": star
            })

    return pd.DataFrame(results)

# ===============================
# 🔗 串關
# ===============================
def build_parlay(df):
    df = df.sort_values(by=["star","prob"], ascending=False)
    picks = df.head(5)

    combos = []

    for i in range(len(picks)):
        for j in range(i+1, len(picks)):
            if picks.iloc[i]["match"] != picks.iloc[j]["match"]:
                combos.append((picks.iloc[i], picks.iloc[j]))

    return combos[:3]

